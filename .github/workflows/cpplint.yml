
name: CppLint Code Style Check

on:
  workflow_call:

jobs:
  cpplint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install cpplint
        run: |
          python3 -m pip install --user cpplint

      - name: Run cpplint
        run: |
          python3 -m cpplint CICDDemo/*.cpp

